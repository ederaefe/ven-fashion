<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#C85A32" />
    </linearGradient>
  </defs>
  <!-- Obsidian Backdrop -->
  <rect width="100" height="100" rx="24" fill="#111111" />
  <!-- Elegant Intersecting Venn Circles (Artisanal / Venn motif) -->
  <circle cx="43" cy="50" r="28" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="57" cy="50" r="28" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-opacity="0.95" />
  <!-- Elegant Editorial Monogram V -->
  <text x="50" y="60" font-family="'Playfair Display', 'Didot', serif" font-style="italic" font-weight="600" font-size="34" fill="#FAF8F5" text-anchor="middle" letter-spacing="-1">V</text>
</svg>